name: Deploy Innovatech
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Desplegar en AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Preparar carpeta
            if [ ! -d "innovatech-devops" ]; then
              git clone https://github.com/manque-123/innovatech-devops.git
            fi
            cd innovatech-devops
            git pull origin main

            # 2. Detener y limpiar todo lo anterior para evitar conflictos de nombres
            sudo docker stop frontend-inno backend-inno || true
            sudo docker rm frontend-inno backend-inno || true
            sudo docker rmi innovatech-backend || true

            # 3. Construir y lanzar BACKEND
            cd backend
            sudo docker build -t innovatech-backend .
            sudo docker run -d --name backend-inno -p 3000:3000 innovatech-backend
            
            # 4. Volver y lanzar FRONTEND (usando la imagen directa de nginx para no fallar)
            cd ..
            sudo docker run -d \
              --name frontend-inno \
              -p 80:80 \
              -v $(pwd)/frontend:/usr/share/nginx/html:ro \
              nginx:alpinename: Deploy Innovatech
