name: Deploy Innovatech
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Desplegar en AWS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navegar a la carpeta del proyecto o clonar si no existe
            if [ ! -d "innovatech-devops" ]; then
              git clone https://github.com/manque-123/innovatech-devops.git
            fi
            cd innovatech-devops
            
            # 2. Actualizar el código desde GitHub
            git pull origin main

            # 3. Limpiar contenedores previos para evitar conflictos
            sudo docker stop frontend-inno || true
            sudo docker rm frontend-inno || true

            # 4. Levantar el contenedor de Nginx mapeando tu carpeta frontend
            # Esto soluciona el error de "Welcome to nginx"
            sudo docker run -d \
              --name frontend-inno \
              -p 80:80 \
              -v $(pwd)/frontend:/usr/share/nginx/html:ro \
              nginx:alpine